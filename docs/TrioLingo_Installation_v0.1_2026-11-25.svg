<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <!-- TrioLingo · Installation · v0.1 · 2026-11-25 -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a9a3c4"/></marker></defs>
  <rect width="900" height="520" rx="18" fill="#0d0a1a"/>
  <text x="30" y="44" fill="#fff" font-size="22" font-weight="900" letter-spacing="1">TRIOLINGO · INSTALLER EN 4 ÉTAPES</text>
  <text x="30" y="68" fill="#ffc21a" font-size="13" font-weight="700">L1 v0.1 · 2026-11-25 · 2 minutes · aucun compte</text>
  <g font-size="13">
    <rect x="30" y="95" width="190" height="150" rx="12" fill="#e0561a"/>
    <text x="125" y="128" text-anchor="middle" fill="#fff" font-size="30">🔗</text>
    <text x="125" y="160" text-anchor="middle" fill="#fff" font-weight="900">1 · OUVRIR LE LIEN</text>
    <text x="125" y="184" text-anchor="middle" fill="#ffe3cc">reçu par message</text>
    <text x="125" y="204" text-anchor="middle" fill="#ffe3cc">iPhone : avec Safari</text>
    <text x="125" y="224" text-anchor="middle" fill="#ffe3cc">Android : avec Chrome</text>
    <rect x="245" y="95" width="190" height="150" rx="12" fill="#e0561a"/>
    <text x="340" y="128" text-anchor="middle" fill="#fff" font-size="30">📲</text>
    <text x="340" y="160" text-anchor="middle" fill="#fff" font-weight="900">2 · INSTALLER</text>
    <text x="340" y="184" text-anchor="middle" fill="#ffe3cc">iPhone : Partager ↑</text>
    <text x="340" y="204" text-anchor="middle" fill="#ffe3cc">→ « Sur l’écran d’accueil »</text>
    <text x="340" y="224" text-anchor="middle" fill="#ffe3cc">Android : ⋮ → Installer</text>
    <rect x="460" y="95" width="190" height="150" rx="12" fill="#e0561a"/>
    <text x="555" y="128" text-anchor="middle" fill="#fff" font-size="30">👷</text>
    <text x="555" y="160" text-anchor="middle" fill="#fff" font-weight="900">3 · PROFIL</text>
    <text x="555" y="184" text-anchor="middle" fill="#ffe3cc">prénom ou pseudo</text>
    <text x="555" y="204" text-anchor="middle" fill="#ffe3cc">+ couleur du casque</text>
    <text x="555" y="224" text-anchor="middle" fill="#ffe3cc">(reste sur le téléphone)</text>
    <rect x="675" y="95" width="195" height="150" rx="12" fill="#17130a" stroke="#ffc21a" stroke-width="2"/>
    <text x="772" y="128" text-anchor="middle" fill="#fff" font-size="30">🧭</text>
    <text x="772" y="160" text-anchor="middle" fill="#ffc21a" font-weight="900">4 · TEST 5 MIN</text>
    <text x="772" y="184" text-anchor="middle" fill="#e8d9a8">règle ton niveau</text>
    <text x="772" y="204" text-anchor="middle" fill="#e8d9a8">🤷 « Je ne sais pas »</text>
    <text x="772" y="224" text-anchor="middle" fill="#e8d9a8">= bonne réponse</text>
  </g>
  <g stroke="#a9a3c4" stroke-width="2" marker-end="url(#a)"><path d="M220 170h22"/><path d="M435 170h22"/><path d="M650 170h22"/></g>
  <rect x="30" y="275" width="410" height="215" rx="14" fill="none" stroke="#5fd38d" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="50" y="305" fill="#5fd38d" font-size="15" font-weight="900">🔒 TES DONNÉES</text>
  <g fill="#dff5e8" font-size="13">
    <text x="50" y="335">✔ restent dans TON téléphone</text>
    <text x="50" y="360">✔ aucun compte, aucun cookie, aucun traceur</text>
    <text x="50" y="385">✔ l’app marche sans réseau une fois installée</text>
    <text x="50" y="410">💾 ⚙ Options → Exporter = fichier de sauvegarde</text>
    <text x="50" y="435">     (à faire 1×/semaine, et avant de changer de tél.)</text>
    <text x="50" y="465">⚠ iPhone : sans installation, Safari peut tout</text>
    <text x="50" y="483">     effacer après 7 jours sans visite</text>
  </g>
  <rect x="460" y="275" width="410" height="215" rx="14" fill="#2a0f18" stroke="#ff6b6b" stroke-width="2"/>
  <text x="480" y="305" fill="#ff8a8a" font-size="15" font-weight="900">🎙 LE MICRO (section Parler, lot 4)</text>
  <g font-size="13" fill="#ffd0d0">
    <text x="480" y="335">L’app te pose la question 1 seule fois :</text>
    <text x="480" y="362" fill="#fff" font-weight="800">OUI → note auto : ta voix part chez</text>
    <text x="480" y="380" fill="#fff" font-weight="800">          Google ou Apple pour être transcrite</text>
    <text x="480" y="407" fill="#5fd38d" font-weight="800">NON → tu te notes toi-même,</text>
    <text x="480" y="425" fill="#5fd38d" font-weight="800">          rien ne sort du téléphone</text>
    <text x="480" y="458">Changer d’avis : ⚙ Options → Micro</text>
  </g>
</svg>
