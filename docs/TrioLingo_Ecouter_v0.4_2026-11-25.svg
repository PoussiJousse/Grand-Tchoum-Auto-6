    <text x="450" y="174" fill="#ffe3cc">écris le mot qui manque</text><text x="450" y="194" fill="#ffe3cc">indice : 1re lettre + longueur</text>
    <rect x="610" y="92" width="260" height="130" rx="12" fill="#17130a" stroke="#ffc21a" stroke-width="2"/>
    <text x="740" y="124" font-size="26">🔢</text><text x="740" y="152" fill="#ffc21a" font-weight="900">4 NOMBRES &amp; HEURES</text>
    <text x="740" y="174" fill="#e8d9a8">13 ou 30 ? 8:15 ou 8:50 ?</text><text x="740" y="194" fill="#e8d9a8">2.5 bar ou 25 bar ?</text>
  </g>
  <g stroke="#a9a3c4" stroke-width="2" marker-end="url(#a)"><path d="M290 157h27"/><path d="M580 157h27"/></g>
  <text x="30" y="268" fill="#fff" font-size="16" font-weight="900">LES BOUTONS</text>
  <g font-size="13">
    <rect x="30" y="284" width="190" height="56" rx="8" fill="#e0561a"/><text x="125" y="318" text-anchor="middle" fill="#fff" font-weight="800">🔊 ÉCOUTER</text>
    <text x="240" y="318" fill="#f4f1ff">vitesse normale, autant de fois que tu veux</text>
    <rect x="30" y="352" width="190" height="56" rx="8" fill="#2c2450" stroke="#7c70b8"/><text x="125" y="386" text-anchor="middle" fill="#fff" font-weight="800">🐢 0,75×</text>
    <text x="240" y="386" fill="#f4f1ff">plus lent, quand ça va trop vite</text>
    <rect x="30" y="420" width="190" height="56" rx="8" fill="#1a1330" stroke="#ffc21a"/><text x="125" y="454" text-anchor="middle" fill="#ffc21a" font-weight="800">👁 TEXTE</text>
