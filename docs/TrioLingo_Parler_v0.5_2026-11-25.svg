    <rect x="262" y="92" width="200" height="70" rx="12" fill="#e0561a"/><text x="362" y="122" fill="#fff" font-weight="900">🎙 2. DIS LA PHRASE</text><text x="362" y="144" fill="#ffe3cc">touche le gros micro</text>
