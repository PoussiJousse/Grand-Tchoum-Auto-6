const dayAdd = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const isNew = c => !S.cards[c.key] || S.cards[c.key].b === 0;

const boxCount = b => CARDS.filter(c => S.cards[c.key] && S.cards[c.key].b === b).length;

const mastCount = th => CARDS.filter(c => (!th || c.th === th) && S.cards[c.key] && S.cards[c.key].b >= MASTER).length;
const ruleDone = r => !!(S.rules[r.id] && S.rules[r.id].done);
const readDone = r => !!(S.reads[r.id] && S.reads[r.id].done);
const dots = b => '●'.repeat(b) + '○'.repeat(MASTER - b);
const spk = (t, rate) => VOICE ? `<button class="spk" data-say="${esc(t)}"${rate ? ` data-rate="${rate}"` : ''} aria-label="écouter">🔊</button>` : '';

function grade(c, good, kind) {
  let s = S.cards[c.key]; if (!s) s = S.cards[c.key] = { b: 0, d: today(), n: 0 };
  s.n = (s.n || 0) + 1;
  if (!good) { s.b = 1; s.d = kind === 'new' ? today() : dayAdd(1); save(); return 'Pas grave : ce mot revient bientôt.'; }
  if (kind === 'practice' && s.b >= 1) { addXP('vocab', 2, .1); return ''; } // hors date : pas de saut de boîte
  const was = s.b; s.b = Math.min(MASTER, s.b + 1); s.d = dayAdd(was >= MASTER ? 30 : INT[s.b]);

}
function newCards(n, th) {

}

/* ---------- Glossaire : mots du lexique soulignés dans les documents (toucher = traduction) ---------- */
let GLOSS = null;
function glossHTML(txt) {
  if (!GLOSS) GLOSS = CARDS.slice().sort((a, b) => b.en.length - a.en.length).map(c => [wordRx(c.en, true), c]);
  const keep = []; let t = txt;
  GLOSS.forEach(([rx, c]) => { t = t.replace(rx, m => { keep.push([m, c]); return '\u0001' + (keep.length - 1) + '\u0002'; }); });
  return esc(t).replace(/\u0001(\d+)\u0002/g, (_, i) => { const [m, c] = keep[+i]; return `<span class="w" data-en="${esc(c.en)}" data-fr="${esc(c.fr)}">${esc(m)}</span>`; });
}

/* ---------- Nombres & heures : générés au hasard (13 ↔ 30, 8:15 ↔ 8:50…) ---------- */
const pick = a => a[Math.floor(Math.random() * a.length)];
function makeNum() {
  const k = Math.floor(Math.random() * 4);
  if (k === 0) { const n = 13 + Math.floor(Math.random() * 7), ctx = pick(['Set the pressure to # bar.', 'We need # new bolts.', 'Go to gate #.', 'The part is on shelf #.', 'The line stopped for # minutes.']);
    return { say: ctx.replace('#', n), q: 'Quel nombre entends-tu ?', o: [String(n), String((n - 10) * 10), String(n === 19 ? 18 : n + 1)] }; }
  if (k === 1) { const h = 1 + Math.floor(Math.random() * 11), M = ['05', '15', '20', '30', '40', '45', '50'], m = pick(M), m2 = pick(M.filter(x => x !== m)), ctx = pick(['The meeting starts at #.', 'The train leaves at #.', 'My shift ends at #.', 'The truck arrives at #.']);
    return { say: ctx.replace('#', `${h}:${m}`), q: 'Quelle heure entends-tu ?', o: [`${h}:${m}`, `${h}:${m2}`, `${h % 12 + 1}:${m}`] }; }
  if (k === 2) { const L = [8, 10, 12, 13, 14, 17, 19, 22, 24], i = 1 + Math.floor(Math.random() * (L.length - 2)), ctx = pick(['Hand me the # millimeter socket.', 'I need a # millimeter wrench.', 'Use the # millimeter bolt.']);
    return { say: ctx.replace('#', L[i]), q: 'Quelle taille entends-tu ?', o: [L[i] + ' mm', L[i - 1] + ' mm', L[i + 1] + ' mm'] }; }
  const D = [['2.5', '25', '5.2'], ['0.5', '5', '0.05'], ['1.5', '15', '5.1'], ['6.4', '64', '4.6'], ['0.1', '1', '0.01']], d = pick(D), u = pick([['bar', 'The pressure is # bar.'], ['mm', 'The gap is # millimeters.']]);
  return { say: u[1].replace('#', d[0]), q: 'Quelle valeur entends-tu ?', o: d.map(x => x + ' ' + u[0]) };
}

/* ---------- Dictée : les phrases d'exemple du vocabulaire (mots déjà vus en priorité) ---------- */
const norm = t => t.toLowerCase().replace(/[’`]/g, "'").replace(/-/g, ' ').replace(/[^a-z0-9' ]/g, '').replace(/\s+/g, ' ').trim();
function lev(a, b) { const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j; for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }
function dictCards(n) {
  const seenC = shuffle(CARDS.filter(c => S.cards[c.key] && S.cards[c.key].b >= 1 && wordRx(c.en).test(c.ex)));
  const easy = shuffle(CARDS.filter(c => c.lvl === 1 && !seenC.includes(c) && wordRx(c.en).test(c.ex)));
  return [...seenC, ...easy].slice(0, n);
}

/* ---------- Progression : la 1re bonne réponse compte plus ; nombres et dictées plafonnés par jour ---------- */
function listenPts(p) { const t = today(); if (!S.ldDay || S.ldDay.d !== t) S.ldDay = { d: t, p: 0 }; const g = Math.max(0, Math.min(p, 30 - S.ldDay.p)); S.ldDay.p += g; return g; }
const audioDone = a => !!(S.audios[a.id] && S.audios[a.id].done);
function nextAudio() { const lvA = S.skills.listen >= 300 ? ['B1', 'A2'] : ['A2', 'B1']; for (const l of lvA) { const a = AUDIOS.find(x => x.lv === l && !audioDone(x)); if (a) return a; } return pick(AUDIOS); }
const audioSteps = a => [{ t: 'audio', a }, ...a.q.map((_, i) => ({ t: 'audioQ', a, i }))];
const dictSteps = n => dictCards(n).map(c => ({ t: 'dict', c }));
const numSteps = n => Array.from({ length: n }, () => ({ t: 'num', g: makeNum() }));
const listenShiftSteps = () => [...audioSteps(nextAudio()), ...dictSteps(3), ...numSteps(4)];
const playBtns = (txt, p) => `<div class="row"><button class="btn sm" data-say="${esc(txt)}" data-pitch="${p || 1}">🔊 Écouter</button><button class="btn alt sm" data-say="${esc(txt)}" data-rate=".75" data-pitch="${p || 1}">🐢 0,75×</button></div>`;

function renderListenStep(st) {
  if (st.t === 'audio') {
    const a = st.a, peek = RUN.peek && RUN.peek[a.id];
    return { body: `<span class="tag y">${a.ic} ${esc(a.t)} · ${a.lv}</span>
      <div class="card" style="text-align:center"><div class="t">${esc(a.who)}</div><div style="font-size:3rem;margin:6px 0">${a.ic}</div>${playBtns(a.txt, a.p)}
        <p class="mut" style="margin-top:8px">Écoute 1 ou 2 fois. Tu peux réécouter pendant les questions.</p></div>
      <details class="doc" id="peek" ${peek ? 'open' : ''}><summary>👁 Afficher le texte (les points d’écoute sont divisés par 2)</summary><pre class="wo">${glossHTML(a.txt)}</pre></details>
      <button class="btn" id="nx" style="justify-content:center">Répondre aux questions</button>`,
      bind: () => { setTimeout(() => say(a.txt, 1, a.p), 400); $('#peek').ontoggle = () => { if ($('#peek').open) { RUN.peek = RUN.peek || {}; RUN.peek[a.id] = true; } }; $('#nx').onclick = () => { sfx('tap'); if ('speechSynthesis' in window) speechSynthesis.cancel(); nextStep(); }; } };
  }
  if (st.t === 'audioQ') {
    const a = st.a, [p, ...o] = a.q[st.i], peek = RUN.peek && RUN.peek[a.id];
    const q = choices(esc(p), o, good => {
      const rs = S.audios[a.id] = S.audios[a.id] || { ok: 0, done: false }, bit = 1 << st.i, first = !(rs.ok & bit), f = peek ? .5 : 1;
      if (good) { addXP('listen', Math.round((first ? 8 : 2) * f), first ? 4 * f : 0); rs.ok |= bit; if (rs.ok === 7 && !rs.done) { rs.done = true; addXP('listen', 10, 6 * f); save(); return '✅ Message compris !'; } save(); return ''; }
      return `Bonne réponse : <b>${esc(o[0])}</b>`;
    }, playBtns(a.txt, a.p) + (peek ? `<details class="doc"><summary>👁 Revoir le texte</summary><pre class="wo">${glossHTML(a.txt)}</pre></details>` : ''));
    return { body: `<span class="tag y">${a.ic} ${esc(a.t)} · ${st.i + 1}/3</span>` + q.html, bind: q.bind };
  }
  if (st.t === 'num') {
    const g = st.g;
    const q = choices(esc(g.q), g.o, good => { if (good) { addXP('listen', 3, listenPts(1)); return ''; } return `Il fallait entendre : <b>${esc(g.o[0])}</b><br><span class="mut">« ${esc(g.say)} »</span>`; }, playBtns(g.say));
    return { body: `<span class="tag y">🔢 Nombres &amp; heures</span>` + q.html, bind: () => { q.bind(); setTimeout(() => say(g.say), 350); } };
  }
  if (st.t === 'dict') {
    const c = st.c, ans = (c.ex.match(wordRx(c.en)) || [c.en])[0];
    const hint = ans.split('').map((ch, i) => i === 0 ? ch : /[a-z]/i.test(ch) ? '_' : ch === ' ' ? '&nbsp;&nbsp;' : ch).join(' ');
    return { body: `<span class="tag y">✍️ Dictée · ${THEMES[c.th][0]} ${esc(thName(c.th))}</span>
      ${playBtns(c.ex)}
      <div class="qp">${esc(c.ex).replace(wordRx(c.en), '<b class="gap">_____</b>')}</div>
      <p class="mut">Indice : <b style="letter-spacing:.1em">${hint}</b> (${ans.replace(/[^a-z]/gi, '').length} lettres) · ${esc(c.fr)}</p>
      <input type="text" id="dIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Écris le mot entendu">
      <div class="row"><button class="btn sm" id="dOk">Valider</button><button class="btn alt sm" id="dIdk">🤷 Je ne sais pas</button></div><div id="qF"></div>`,
      bind: () => {
        setTimeout(() => say(c.ex), 400); let lock = false;
        const check = idk => {
          if (lock) return; const v = norm($('#dIn').value); if (!idk && !v) { $('#dIn').focus(); return; } lock = true;
          const target = norm(ans), d = idk ? 99 : lev(v, target), good = d === 0 || (d === 1 && target.length >= 5);
          RUN.g.tot++; let msg;
          if (good) { RUN.g.ok++; sfx('ok'); buzz(15); addXP('listen', 4, listenPts(1.5)); msg = d === 0 ? '✅ Parfait !' : `✅ Presque ! Ça s’écrit : <b>${esc(ans)}</b>`; }
          else { sfx(idk ? 'tap' : 'no'); msg = `Le mot était : <b>${esc(ans)}</b> (${esc(c.fr)})`; }
          $('#dIn').disabled = true; $('#dIn').classList.add(good ? 'okin' : 'noin');
          $('#qF').innerHTML = `<p class="card ${good ? 'ok' : ''}" style="margin-top:10px">${msg}<br><span class="mut">« ${esc(c.ex)} »</span></p><button class="btn" id="qN" style="justify-content:center;margin-top:10px">${T('next')}</button>`;
          $('#qN').onclick = () => { sfx('tap'); nextStep(); }; $('#qN').scrollIntoView({ block: 'nearest' });
        };
        $('#dOk').onclick = () => check(false); $('#dIdk').onclick = () => check(true);
        $('#dIn').onkeydown = e => { if (e.key === 'Enter') check(false); };
      } };
  }
  return null;
}

function renderQ() {
  const q = PTS.list[PTS.i], n = PTS.list.length, k = SK.find(x => x.id === q.k), pct = Math.round(PTS.i / n * 100);
  const opts = shuffle(q.o.map((t, i) => ({ t, good: i === 0 })));
  $('#test').innerHTML = `<div class="row"><span class="tag y">${k.ic} ${esc(k.fr)}</span><span class="grow"></span><button class="btn alt sm" id="qStop" style="width:auto">✕ Arrêter</button></div>

    ${q.say ? `<div class="row"><button class="btn sm" id="qPlay">🔊 Écouter</button><button class="btn alt sm" id="qSlow">🐢 0,75×</button></div>` : ''}
    <div class="big" style="margin-top:4px">${esc(q.q)}</div>
    <div id="qO">${opts.map((o, i) => `<button class="ch" data-i="${i}">${esc(o.t)}</button>`).join('')}<button class="ch idk" data-i="-1">🤷 Je ne sais pas</button></div>`;

  $$('#qO .ch').forEach(b => b.onclick = () => {

    const i = +b.dataset.i, good = i >= 0 && opts[i].good;
    $$('#qO .ch').forEach((x, j) => { if (j < opts.length && opts[j].good) x.classList.add('ok'); });

    setTimeout(() => { PTS.i++; if (PTS.i < PTS.list.length) renderQ(); else endTest(); }, good ? 650 : 1100);
  });

function endTest() {
  const retake = S.placed, asked = new Set(PTS.list.map(q => q.k)); // seules les compétences vraiment posées comptent
  SK.forEach(k => {
    if (!asked.has(k.id)) return;
    const sc = SCORE[PTS.ok[k.id] || 0];
    S.skills[k.id] = retake ? Math.max(S.skills[k.id], sc) : sc; // un nouveau test ne fait jamais baisser
    S.tested[k.id] = true;
  });
  S.placed = true; PTS = null; addXP(null, 50); sfx('lvl'); buzz([30, 40, 30]);
  show('res');
}

/* ---------- Installation sur l'écran d'accueil ---------- */
let DEFER = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); DEFER = e; });
function installHelp() {
  if (DEFER) { DEFER.prompt(); DEFER.userChoice.finally(() => { DEFER = null; }); return; }
  modal({
    title: '📲 Installer TrioLingo', body: `<p>Une fois installée, l’app s’ouvre comme une vraie appli, marche sans réseau, et l’iPhone ne peut plus effacer tes progrès.</p>

/* ---------- Export / import / réinitialisation (avec barre de progression) ---------- */
async function doExport() {
  const pg = progModal('💾 Export de ta sauvegarde');
  pg(15, 'Préparation…'); await wait(200);
  const data = JSON.stringify({ app: 'TrioLingo', version: VERSION, exported: today(), data: S }, null, 1);
  pg(55, 'Création du fichier…'); await wait(200);
  try {
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = `TrioLingo_Sauvegarde_${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    S.lastExport = today(); save();
    pg(100, 'Terminé'); await wait(300);
    modal({ title: '✅ Sauvegarde exportée', body: `<p>Fichier : <b>TrioLingo_Sauvegarde_${today()}.json</b></p><p class="mut">Il est dans tes Téléchargements (ou Fichiers sur iPhone). Garde-le au chaud : il contient ton prénom et tes progrès, rien d’autre.</p>` });
  } catch (e) { modal({ title: '⚠ Export impossible', body: '<p>Ce navigateur a bloqué la création du fichier. Essaie depuis l’app installée ou un autre navigateur.</p>' }); }
  if ($('#opt').classList.contains('on')) RENDER.opt(); else if ($('#home').classList.contains('on')) RENDER.home();
}
$('#fileIn').onchange = e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    let o; try { o = JSON.parse(r.result); } catch (_) { o = null; }
    if (!o || o.app !== 'TrioLingo' || !o.data || !o.data.skills) { modal({ title: '⚠ Fichier refusé', body: '<p>Ce fichier n’est pas une sauvegarde TrioLingo.</p>' }); return; }
    const d = merge(o.data);
    confirmBox('📂 Importer cette sauvegarde ?', `<p><b>${esc(d.name || '?')}</b> · ${d.xp} XP · exportée le ${esc(o.exported || '?')}</p><p>Elle <b>remplace</b> ta progression actuelle. Une copie de secours de l’actuelle est gardée dans le téléphone.</p>`, async () => {
      const pg = progModal('📂 Import'); pg(20, 'Copie de secours…');
      try { localStorage.setItem(KEY + '_avant_import', JSON.stringify(S)); } catch (_) { }
      await wait(200); pg(70, 'Chargement…'); S = d; SAVE_LOCK = false; save(); await wait(200); pg(100, 'Terminé'); await wait(250);
      closeModal(); toast('✅ Sauvegarde importée'); show('home');
    }, 'Importer');
  };
  r.readAsText(f);
};
function doReset() {
  confirmBox('🗑 Tout effacer ?', '<p>Profil, niveaux, XP et réglages seront effacés <b>de ce téléphone</b>.</p><p class="mut">Conseil : exporte d’abord ta sauvegarde. Une copie de secours est quand même gardée.</p>', () => {
    try { localStorage.setItem(KEY + '_avant_effacement', JSON.stringify(S)); } catch (_) { }
    S = def(); SAVE_LOCK = false; save(); toast('Tout est effacé.'); EDIT = false; show('onb');
  }, 'Effacer', 'red');
}

/* ---------- Mode hors-ligne : uniquement quand l'app est servie par un vrai site (https) ---------- */
async function regSW() {
  if (!('serviceWorker' in navigator)) return;
  if (!(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
  try { const r = await navigator.serviceWorker.register('sw.js'); r.update().catch(() => { }); } catch (e) { }
}

/* ================= Démarrage (barre de progression) ================= */
async function boot() {
  const setB = (p, l) => { $('#bI').style.width = p + '%'; $('#bP').textContent = Math.round(p) + ' %'; $('#bL').textContent = l; };
  const steps = [['Lecture de ta sauvegarde…', async () => load()], ['Recherche d’une voix anglaise…', initVoices], ['Mode hors-ligne…', regSW], ['Préparation des écrans…', async () => applyStatic()]];
  for (let i = 0; i < steps.length; i++) { setB(i / steps.length * 100, steps[i][0]); try { await steps[i][1](); } catch (e) { } await wait(160); }
  setB(100, LOADERR ? '⚠ Sauvegarde abîmée : copie de secours gardée' : 'Prêt !');
  const b = $('#bgo'); b.style.display = 'flex';
  b.onclick = () => { ac(); sfx('ok'); if (!S.name) { EDIT = false; show('onb'); } else show('home'); };
}
addEventListener('pageshow', () => { if (!$('#boot').classList.contains('on') && $('#home').classList.contains('on')) RENDER.home(); });
boot();
/* Accès de test (lecture seule) */
window.__TL = { get S() { return S; }, VERSION };
