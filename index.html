<script>
'use strict';
/* ============ TrioLingo · L1 v0.1 · 2026-11-25 · socle ============ */
const VERSION = 'L1 v0.1', BUILD = '2026-11-25', KEY = 'tl_save_v1';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Compétences et niveaux (CECRL) ---------- */
const SK = [
  { id: 'vocab', ic: '🗂', fr: 'Vocabulaire', en: 'Vocabulary' },
  { id: 'gram', ic: '📐', fr: 'Grammaire', en: 'Grammar' },
  { id: 'conj', ic: '⏱', fr: 'Conjugaison', en: 'Verb tenses' },
  { id: 'synt', ic: '🧩', fr: 'Syntaxe', en: 'Word order' },
  { id: 'read', ic: '📖', fr: 'Lecture', en: 'Reading' },
  { id: 'listen', ic: '🎧', fr: 'Écoute', en: 'Listening' },
  { id: 'oral', ic: '🎙', fr: 'Oral', en: 'Speaking' }];
const BANDS = ['A1', 'A2', 'B1', 'B2', 'C1'], XP_LVL = 250;
const cefr = sc => { const i = Math.min(4, Math.floor(sc / 200)); return BANDS[i] + (i < 4 && sc - i * 200 >= 100 ? '+' : ''); };
const skName = k => uiEN('menu') ? k.en : k.fr;

/* ---------- Sauvegarde locale (jamais envoyée) ---------- */
function def() {
  return {
    v: 1, app: 'TrioLingo', created: today(), name: '', avatar: { h: 0, s: 1 }, xp: 0,
    skills: Object.fromEntries(SK.map(k => [k.id, 0])), placed: false, tested: {}, days: {},
    settings: { sfx: true, vib: true, ui: 'auto', sr: null }, lastExport: null, installHintOff: false
  };
}
function merge(o) {
  const d = def(), r = Object.assign(d, o);
  r.settings = Object.assign(def().settings, o.settings || {});
  r.skills = Object.assign(def().skills, o.skills || {});
  r.avatar = Object.assign(def().avatar, o.avatar || {});
  r.days = o.days && typeof o.days === 'object' ? o.days : {};
  r.tested = o.tested && typeof o.tested === 'object' ? o.tested : {};
  for (const k in r.skills) r.skills[k] = Math.max(0, Math.min(1000, +r.skills[k] || 0));
  r.xp = Math.max(0, +r.xp || 0); r.name = String(r.name || '').slice(0, 20);
  return r;
}
let S = def(), LOADERR = '', SAVE_LOCK = false, saveWarned = false;
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { LOADERR = 'stockage indisponible (navigation privée ?)'; return; }
  if (!raw) return;
  try { const o = JSON.parse(raw); if (!o || typeof o !== 'object' || !o.skills) throw new Error('format inconnu'); S = merge(o); }
  catch (e) {
    LOADERR = 'sauvegarde illisible : ' + (e.message || e);
    // Leçon BigWallQuest v0.19.2 : on garde une copie AVANT tout, et on n'écrase jamais en silence.
    try { localStorage.setItem(KEY + '_secours_' + Date.now(), raw); } catch (_) { SAVE_LOCK = true; }
  }
}
function save() {
  if (SAVE_LOCK) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast('⚠ Sauvegarde impossible sur ce téléphone (stockage plein ou bloqué).'); } }
}
const avg = () => { const ids = SK.filter(k => k.id !== 'oral' || S.tested.oral).map(k => k.id); return ids.reduce((a, k) => a + S.skills[k], 0) / ids.length; };
const lvl = () => 1 + Math.floor(S.xp / XP_LVL);
function addXP(skill, n) {
  const before = lvl();
  if (skill) S.skills[skill] = Math.min(1000, (S.skills[skill] || 0) + n);
  S.xp += n; S.days[today()] = (S.days[today()] || 0) + n; save();
  if (lvl() > before) { sfx('lvl'); buzz([30, 40, 30]); toast('⭐ ' + T('lvlUp') + ' ' + lvl() + ' !'); }
}

/* ---------- Langue de l'interface : FR au début, puis bascule progressive (D5) ---------- */
const STR = {
  home: ['Accueil', 'Home', 'm'], prog: ['Progrès', 'Progress', 'm'], lex: ['Lexique', 'Glossary', 'm'], opt: ['Options', 'Settings', 'm'],
  read: ['Lire & apprendre', 'Read & learn', 'm'], speak: ['Parler', 'Speak', 'm'], listen: ['Écouter', 'Listen', 'm'], myst: ['Mode mystère', 'Mystery mode', 'm'],
  hi: ['Salut', 'Hi', 'm'], tech: ['Technicien niv.', 'Technician lvl', 'm'], lvlUp: ['Niveau', 'Level', 'm'],
  soon: ['Arrive au lot', 'Coming in batch', 'm'], ok: ['OK', 'OK', 'm'], cancel: ['Annuler', 'Cancel', 'm'], confirm: ['Confirmer', 'Confirm', 'm'],
  week: ['Cette semaine', 'This week', 'm'], skills: ['Mes compétences', 'My skills', 'm'], next: ['Suivant', 'Next', 'm'], close: ['Fermer', 'Close', 'm'],
  sRead: ['vocabulaire métier', 'job vocabulary', 'm'], sSpeak: ['prononciation', 'pronunciation', 'm'], sListen: ['briefings &amp; consignes', 'briefings &amp; instructions', 'm']
};
function uiEN(kind) { const m = S.settings.ui; if (m === 'fr') return false; if (m === 'en') return true; return kind === 'm' || kind === 'menu' ? avg() >= 250 : avg() >= 400; }
function T(k) { const e = STR[k]; return e ? (uiEN(e[2] || 't') ? e[1] : e[0]) : k; }
function applyStatic() { $$('[data-s]').forEach(el => el.textContent = T(el.dataset.s)); document.documentElement.lang = uiEN('m') ? 'en' : 'fr'; }

/* ---------- Son synthétisé (aucun fichier) + vibrations ---------- */
let AC = null;
function ac() { if (AC === null) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } } if (AC && AC.state === 'suspended') AC.resume().catch(() => { }); return AC; }
function sfx(n) {
  if (!S.settings.sfx) return; const a = ac(); if (!a) return;
  const N = { tap: [[660, .04]], ok: [[660, .07], [990, .12]], no: [[330, .1], [262, .14]], lvl: [[523, .09], [659, .09], [784, .09], [1047, .25]] }[n] || [];
  let t = a.currentTime;
  N.forEach(([f, d]) => { const o = a.createOscillator(), g = a.createGain(); o.type = 'square'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.06, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02); t += d * .9; });
}
function buzz(p) { if (S.settings.vib && navigator.vibrate) try { navigator.vibrate(p); } catch (e) { } }

/* ---------- Voix anglaise : uniquement les voix installées sur le téléphone (localService) ---------- */
let VOICE = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return null;
  const v = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang) && v.localService);
  return v.find(x => /en[-_]US/i.test(x.lang)) || v[0] || null;
}
function initVoices() {
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return res(null);
    let done = false; const fin = () => { VOICE = pickVoice(); if (!done) { done = true; res(VOICE); } };
    speechSynthesis.onvoiceschanged = fin; // les voix arrivent parfois en retard
    if (speechSynthesis.getVoices().length) fin(); else setTimeout(fin, 1500);
  });
}
function say(text, rate = 1) {
  return new Promise(res => {
    if (!VOICE) return res(false);
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice = VOICE; u.lang = VOICE.lang; u.rate = .92 * rate; u.onend = () => res(true); u.onerror = () => res(false); speechSynthesis.speak(u); }
    catch (e) { res(false); }
  });
}

/* ---------- Reconnaissance vocale du navigateur : sur demande, consentement explicite (D1 + D1 bis) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const srStatus = () => !SR ? 'Non proposée par ce navigateur → auto-note locale' : S.settings.sr === true ? 'Autorisée (la voix part chez Google / Apple)' : S.settings.sr === false ? 'Refusée → auto-note, 100 % local' : 'Pas encore demandée';
function askSR() {
  return new Promise(res => {
    if (!SR) { S.settings.sr = false; save(); modal({ title: '🎙 Micro', body: '<p>Ce navigateur ne propose pas la reconnaissance vocale.</p><p>Dans « Parler », tu t’enregistreras et tu te noteras toi-même : <b>rien ne sort du téléphone</b>.</p>', btns: [[T('ok'), () => res(false)]] }); return; }
    modal({
      title: '🎙 Note automatique de ta prononciation ?',
      body: `<div class="flow"><div>🎙<br>ta voix</div><span class="x">→</span><div style="border-color:var(--bad)">☁<br>Google / Apple</div><span class="x">→</span><div>📝<br>texte</div><span class="x">→</span><div>✅<br>note</div></div>
        <p>Pour te noter tout seul, <b>ton navigateur envoie l’enregistrement de ta voix</b> aux serveurs de Google (Android, Chrome) ou d’Apple (iPhone), qui le transforment en texte.</p>
        <p>TrioLingo ne garde rien et n’envoie rien d’autre : ni prénom, ni score.</p>
        <p class="card ok" style="margin:0">Si tu dis <b>Non</b> : tu t’enregistres, tu compares avec le modèle, tu te notes toi-même. <b>Rien ne sort du téléphone.</b></p>
        <p class="mut">Tu peux changer d’avis à tout moment : ⚙ Options → Micro.</p>`,
      btns: [['Non, 100 % local', () => { S.settings.sr = false; save(); res(false); }, 'alt'], ['Oui, autoriser', () => { S.settings.sr = true; save(); res(true); }]]
    });
  });
}

/* ---------- Fenêtres, messages, progression ---------- */
function modal({ title, body, btns }) {
  $('#mT').innerHTML = title; $('#mB').innerHTML = body; const f = $('#mF'); f.innerHTML = '';
  (btns || [[T('close')]]).forEach(([l, fn, cls]) => { const b = document.createElement('button'); b.className = 'btn sm ' + (cls || ''); b.innerHTML = l; b.onclick = () => { sfx('tap'); closeModal(); fn && fn(); }; f.appendChild(b); });

function radar(size, labels) {
  const v = SK.map(k => Math.max(.05, Math.min(1, S.skills[k.id] / 800)));
  const pad = labels ? 34 : 6, c = size / 2, r = c - pad, n = v.length;
  const pt = (i, k) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [(c + Math.cos(a) * r * k).toFixed(1), (c + Math.sin(a) * r * k).toFixed(1)]; };
  let s = `<svg viewBox="0 0 ${size} ${size}" width="100%" role="img" aria-label="Radar des compétences">`;
  [.25, .5, .75, 1].forEach(k => s += `<polygon points="${v.map((_, i) => pt(i, k).join(',')).join(' ')}" fill="none" stroke="rgba(255,255,255,.14)"/>`);
  v.forEach((_, i) => { const [x, y] = pt(i, 1); s += `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.1)"/>`; });
  s += `<polygon points="${v.map((k, i) => pt(i, k).join(',')).join(' ')}" fill="rgba(255,122,47,.35)" stroke="#ff7a2f" stroke-width="2" stroke-linejoin="round"/>`;
  if (labels) SK.forEach((k, i) => { const [x, y] = pt(i, 1.24); s += `<text x="${x}" y="${+y + 4}" text-anchor="middle" fill="#a9a3c4" font-size="10.5" font-family="system-ui">${k.ic} ${esc(cefr(S.skills[k.id]))}</text>`; });
  return s + '</svg>';
}

function avatar(a, sz = 64) {
  const h = HATS[a.h] || HATS[0], s = SKINS[a.s] || SKINS[1];

function renderQ() {
  const q = PTS.list[PTS.i], n = PTS.list.length, k = SK.find(x => x.id === q.k), pct = Math.round(PTS.i / n * 100);

    <div class="card"><div class="opt"><div style="flex:none">${avatar(S.avatar, 48)}</div><div class="lab"><b>${esc(S.name)}</b><span class="mut">Profil sur ce téléphone</span></div><button class="btn alt sm" id="oEdit" style="width:auto">Modifier</button></div></div>

      <div class="opt"><div class="lab"><b>📳 Vibrations</b></div><button class="tg ${s.vib ? 'on' : ''}" data-tg="vib">${s.vib ? 'ON' : 'OFF'}</button></div>

/* ---------- Voix : test ou guide d'installation ---------- */
function testVoice() {
  if (VOICE) { say('Hello! Please check the oil level on line three.'); toast('🔊 « Hello! Please check the oil level on line three. »'); return; }
  modal({
    title: '🗣 Installer une voix anglaise', body: `<p>Aucune voix anglaise <b>installée sur le téléphone</b> n’a été trouvée. (Les voix « en ligne » sont ignorées exprès : elles envoient le texte sur Internet.)</p>
    <div class="card"><b>🤖 Android</b><ol><li>Ouvre <b>Paramètres</b>.</li><li>Cherche <b>« Synthèse vocale »</b> (texte-parole).</li><li>Moteur Google → ⚙ → <b>Installer les données vocales</b>.</li><li>Choisis <b>English (United States)</b> → télécharger.</li></ol></div>
    <div class="card"><b>🍏 iPhone</b><ol><li>Ouvre <b>Réglages → Accessibilité</b>.</li><li><b>Contenu énoncé → Voix</b>.</li><li><b>Anglais (États-Unis)</b> → télécharge une voix.</li></ol></div>
    <p>Puis ferme et rouvre TrioLingo.</p>`
  });
}

/* ---------- Installation sur l'écran d'accueil ---------- */
let DEFER = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); DEFER = e; });
function installHelp() {
  if (DEFER) { DEFER.prompt(); DEFER.userChoice.finally(() => { DEFER = null; }); return; }
  modal({
    title: '📲 Installer TrioLingo', body: `<p>Une fois installée, l’app s’ouvre comme une vraie appli, marche sans réseau, et l’iPhone ne peut plus effacer tes progrès.</p>
    <div class="card"><b>🍏 iPhone (Safari)</b><ol><li>Touche <b>Partager</b> (carré avec flèche ↑).</li><li>Choisis <b>« Sur l’écran d’accueil »</b>.</li><li>Touche <b>Ajouter</b>.</li></ol></div>
    <div class="card"><b>🤖 Android (Chrome)</b><ol><li>Touche le menu <b>⋮</b> en haut à droite.</li><li>Choisis <b>« Installer l’application »</b> (ou « Ajouter à l’écran d’accueil »).</li></ol></div>`,
    btns: [['Ne plus afficher', () => { S.installHintOff = true; save(); if ($('#home').classList.contains('on')) RENDER.home(); }, 'alt'], [T('ok')]]
  });
}

/* ---------- Export / import / réinitialisation (avec barre de progression) ---------- */
async function doExport() {
  const pg = progModal('💾 Export de ta sauvegarde');
  pg(15, 'Préparation…'); await wait(200);
  const data = JSON.stringify({ app: 'TrioLingo', version: VERSION, exported: today(), data: S }, null, 1);
  pg(55, 'Création du fichier…'); await wait(200);
  try {
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = `TrioLingo_Sauvegarde_${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
    S.lastExport = today(); save();
    pg(100, 'Terminé'); await wait(300);
    modal({ title: '✅ Sauvegarde exportée', body: `<p>Fichier : <b>TrioLingo_Sauvegarde_${today()}.json</b></p><p class="mut">Il est dans tes Téléchargements (ou Fichiers sur iPhone). Garde-le au chaud : il contient ton prénom et tes progrès, rien d’autre.</p>` });
  } catch (e) { modal({ title: '⚠ Export impossible', body: '<p>Ce navigateur a bloqué la création du fichier. Essaie depuis l’app installée ou un autre navigateur.</p>' }); }
  if ($('#opt').classList.contains('on')) RENDER.opt(); else if ($('#home').classList.contains('on')) RENDER.home();
}
$('#fileIn').onchange = e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    let o; try { o = JSON.parse(r.result); } catch (_) { o = null; }
    if (!o || o.app !== 'TrioLingo' || !o.data || !o.data.skills) { modal({ title: '⚠ Fichier refusé', body: '<p>Ce fichier n’est pas une sauvegarde TrioLingo.</p>' }); return; }
    const d = merge(o.data);
    confirmBox('📂 Importer cette sauvegarde ?', `<p><b>${esc(d.name || '?')}</b> · ${d.xp} XP · exportée le ${esc(o.exported || '?')}</p><p>Elle <b>remplace</b> ta progression actuelle. Une copie de secours de l’actuelle est gardée dans le téléphone.</p>`, async () => {
      const pg = progModal('📂 Import'); pg(20, 'Copie de secours…');
      try { localStorage.setItem(KEY + '_avant_import', JSON.stringify(S)); } catch (_) { }
      await wait(200); pg(70, 'Chargement…'); S = d; SAVE_LOCK = false; save(); await wait(200); pg(100, 'Terminé'); await wait(250);
      closeModal(); toast('✅ Sauvegarde importée'); show('home');
    }, 'Importer');
  };
  r.readAsText(f);
};
function doReset() {
  confirmBox('🗑 Tout effacer ?', '<p>Profil, niveaux, XP et réglages seront effacés <b>de ce téléphone</b>.</p><p class="mut">Conseil : exporte d’abord ta sauvegarde. Une copie de secours est quand même gardée.</p>', () => {
    try { localStorage.setItem(KEY + '_avant_effacement', JSON.stringify(S)); } catch (_) { }
    S = def(); SAVE_LOCK = false; save(); toast('Tout est effacé.'); EDIT = false; show('onb');
  }, 'Effacer', 'red');
}

/* ---------- Mode hors-ligne : uniquement quand l'app est servie par un vrai site (https) ---------- */
async function regSW() {
  if (!('serviceWorker' in navigator)) return;
  if (!(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;
  try { const r = await navigator.serviceWorker.register('sw.js'); r.update().catch(() => { }); } catch (e) { }
}

/* ================= Démarrage (barre de progression) ================= */
async function boot() {
  const setB = (p, l) => { $('#bI').style.width = p + '%'; $('#bP').textContent = Math.round(p) + ' %'; $('#bL').textContent = l; };
  const steps = [['Lecture de ta sauvegarde…', async () => load()], ['Recherche d’une voix anglaise…', initVoices], ['Mode hors-ligne…', regSW], ['Préparation des écrans…', async () => applyStatic()]];
  for (let i = 0; i < steps.length; i++) { setB(i / steps.length * 100, steps[i][0]); try { await steps[i][1](); } catch (e) { } await wait(160); }
  setB(100, LOADERR ? '⚠ Sauvegarde abîmée : copie de secours gardée' : 'Prêt !');
  const b = $('#bgo'); b.style.display = 'flex';
  b.onclick = () => { ac(); sfx('ok'); if (!S.name) { EDIT = false; show('onb'); } else show('home'); };
}
addEventListener('pageshow', () => { if (!$('#boot').classList.contains('on') && $('#home').classList.contains('on')) RENDER.home(); });
boot();
/* Accès de test (lecture seule) */
window.__TL = { get S() { return S; }, VERSION };
